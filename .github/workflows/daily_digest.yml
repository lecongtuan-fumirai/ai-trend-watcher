name: Daily AI Builder Digest

on:
  schedule:
    # Chạy mỗi ngày lúc 00:00 UTC (tức 07:00 sáng giờ Việt Nam UTC+7)
    - cron: '0 0 * * *'
  workflow_dispatch: # Cho phép trigger bằng tay qua giao diện GitHub Actions

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run AI Trend Digest Pipeline
        env:
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'gemini' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL || 'gemini-3.8-flash' }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          TOP_K_PER_SOURCE: '10'
        run: npm start

      - name: Commit updated cache (prevent duplicate digests)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cache/sent_items.json || true
          git diff --staged --quiet || git commit -m "chore: update sent items cache [skip ci]"
          git push || true
