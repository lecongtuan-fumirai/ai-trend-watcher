services:
  watcher:
    image: tuanstark/ai-trend-watcher:latest
    container_name: ai_trend_watcher
    restart: unless-stopped
    command: ["tail", "-f", "/dev/null"]
    env_file:
      - .env
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./cache:/app/cache
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.watcher.schedule: "0 0 9 * * *"
      ofelia.job-exec.watcher.command: "node src/main.js"

  scheduler:
    image: mcuadros/ofelia:latest
    container_name: digest_scheduler
    restart: unless-stopped
    depends_on:
      - watcher
    command: daemon --docker
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
